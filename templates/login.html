<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gerenciador de Planos de Aula</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <!-- Lucide Icons para os ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="flex min-h-screen items-center justify-center px-4">

    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border border-gray-100">
        <div class="flex flex-col items-center mb-6">
            <div class="p-3 bg-blue-100 text-blue-600 rounded-full mb-3">
                <i data-lucide="book-open" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Acesse sua Conta</h2>
            <p class="text-gray-500 text-sm mt-1">Gerencie seus planos de aula com facilidade</p>
        </div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="email" id="login-email" placeholder="seu@email.com" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div>
                <div class="flex justify-between mb-1">
                    <label class="text-sm font-medium text-gray-700">Senha</label>
                    <a href="#" class="text-xs text-blue-600 hover:underline">Esqueceu a senha?</a>
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
                    <input type="password" id="login-senha" placeholder="••••••••" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="flex items-center">
                <input id="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                <label for="remember-me" class="ml-2 block text-sm text-gray-600">Lembrar de mim</label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 shadow-md">
                Entrar
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-600">
            Não tem uma conta? 
            <a href="/cadastro" class="text-blue-600 font-medium hover:underline">Cadastre-se</a>
        </div>
    </div>

    <script src="{{url_for('static', filename='login.js')}}"></script>
</body>
</html>
